<!DOCTYPE html>
<html>
<head>
    <title>Hidden Element Test</title>
    <style>
        .hidden { display: none; }
        .invisible { visibility: hidden; }
        .zero-opacity { opacity: 0; }
        .offscreen { position: absolute; left: -9999px; }
    </style>
</head>
<body>
    <h1>হিডেন এলিমেন্ট টেস্ট</h1>
    
    <!-- দৃশ্যমান -->
    <p>দৃশ্যমান: 01712345678</p>
    
    <!-- display:none -->
    <div class="hidden">হিডেন: 01812345678</div>
    
    <!-- visibility:hidden -->
    <div class="invisible">ইনভিজিবল: 01912345678</div>
    
    <!-- opacity:0 -->
    <div class="zero-opacity">স্বচ্ছ: 01612345678</div>
    
    <!-- offscreen -->
    <div class="offscreen">অফস্ক্রিন: 01512345678</div>
    
    <!-- hidden attribute -->
    <div hidden>এইচটিএমএল হিডেন: 01312345678</div>
    
    <script>
        console.log('হিডেন টেস্ট পেজ লোড হয়েছে');
        console.log('নম্বরগুলো: 01712345678, 01812345678, 01912345678, 01612345678, 01512345678, 01312345678');
    </script>
</body>
</html>
