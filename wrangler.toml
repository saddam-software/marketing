name = "email-extractor-pro"
type = "javascript"
compatibility_date = "2024-11-01"

# KV Namespace (ঐচ্ছিক)
kv_namespaces = [
  { binding = "SECRETS_KV", id = "YOUR_KV_NAMESPACE_ID", preview_id = "YOUR_KV_PREVIEW_ID" }
]

# ===== D1 ডেটাবেস বাইন্ডিং =====
[[d1_databases]]
binding = "DB"
database_name = "profiles-db"
database_id = "9d11ebc2-47db-45d7-9ec1-e36ed8f644d8"

# ===== Pages Routes (ঐচ্ছিক) =====
routes = [
  { pattern = "example.com/api/*", zone_name = "example.com" }
]

# ===== মাল্টি-সোর্স API কী (এখানে বসান) =====
[vars]
JWT_SECRET = "LocalDevelopmentSecretKey123!@#"

# গুগল প্লেসেস API (https://console.cloud.google.com/)
GOOGLE_PLACES_API_KEY = "YOUR_GOOGLE_API_KEY"  

# ফোরস্কয়ার API (https://foursquare.com/developers/)
FOURSQUARE_API_KEY = "YOUR_FOURSQUARE_API_KEY"

# ইয়েলপ ফিউশন API (https://www.yelp.com/developers)
YELP_API_KEY = "YOUR_YELP_API_KEY"

# ===== প্রোডাকশন এনভায়রনমেন্ট =====
[env.production]
vars = {
  ADMIN_USERNAME = "saddam",
  ADMIN_PASSWORD = "SecurePass@2024",
  BREVO_API_KEY = "xkeysib-....",
  JWT_SECRET = "MySuperSecretProductionKey...",
  GOOGLE_PLACES_API_KEY = "YOUR_GOOGLE_API_KEY",
  FOURSQUARE_API_KEY = "YOUR_FOURSQUARE_API_KEY",
  YELP_API_KEY = "YOUR_YELP_API_KEY"
}

# প্রোডাকশন KV
[[env.production.kv_namespaces]]
binding = "SECRETS_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

# প্রোডাকশন D1
[[env.production.d1_databases]]
binding = "DB"
database_name = "profiles-db"
database_id = "9d11ebc2-47db-45d7-9ec1-e36ed8f644d8"
