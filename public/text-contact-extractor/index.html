<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk Text Extractor · Pro</title>

    <!-- Tailwind CSS (lightweight) -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- External CSS (আমাদের কাস্টম স্টাইল) -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="bulkTextExtractor" class="extractor-card">

        <!-- ===== HEADER (ডার্ক) ===== -->
        <div class="extractor-header">
            <h1>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Bulk Text Extractor
            </h1>
            <div class="header-badge">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>

        <!-- ===== BODY: Input Section (Text + File) ===== -->
        <div class="extractor-body">

            <!-- Left: Text Input -->
            <div class="input-group">
                <div class="input-header">
                    <label>✏️ Paste Text</label>
                    <span class="counter" id="charCount">0 characters</span>
                </div>
                <textarea id="textInput" rows="4" placeholder="Paste your text here..."></textarea>
                <button id="extractTextBtn" class="btn-primary">Extract Text</button>
            </div>

            <!-- Right: File Upload -->
            <div class="input-group">
                <div class="input-header">
                    <label>📂 Upload File</label>
                    <span class="counter" id="wordCount">0 words</span>
                </div>
                <div id="dropZone" class="drop-zone">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    <p>Drag & drop or click</p>
                    <span class="text-[10px] text-slate-400">.txt, .csv, .log</span>
                    <input type="file" id="fileInput" accept=".txt,.csv,.log" class="file-input" />
                </div>
                <div id="fileInfo" class="file-info" style="display:none;">
                    <span id="fileName" class="truncate"></span>
                    <span id="fileSize" class="text-slate-400"></span>
                    <button id="fileClearBtn" class="clear-btn">✕</button>
                </div>
                <button id="processFileBtn" class="btn-secondary" disabled>Process File</button>
            </div>

        </div>

        <!-- ===== PROGRESS BAR ===== -->
        <div id="processingContainer" class="progress-container">
            <div class="progress-label">
                <span id="processingLabel" class="font-semibold">Processing...</span>
                <span id="processingPercent" class="font-bold text-blue-600">0%</span>
            </div>
            <div class="progress-track">
                <div id="processingProgress" class="progress-fill"></div>
            </div>
        </div>

        <!-- ===== ANALYTICS BAR ===== -->
        <div class="analytics-bar">
            <div class="analytics-item">
                <span class="dot blue"></span>
                <span class="label">Total</span>
                <span class="value" id="totalFound">0</span>
            </div>
            <div class="analytics-item">
                <span class="dot amber"></span>
                <span class="label">Duplicates</span>
                <span class="value" id="duplicatesRemoved">0</span>
            </div>
            <div class="analytics-item">
                <span class="dot green"></span>
                <span class="label">Emails</span>
                <span class="value" id="validEmails">0</span>
            </div>
            <div class="analytics-item">
                <span class="dot purple"></span>
                <span class="label">Phones</span>
                <span class="value" id="validPhones">0</span>
            </div>
        </div>

        <!-- ===== RESULTS ===== -->
        <div class="results-section">

            <!-- Toolbar -->
            <div class="results-toolbar">
                <div class="toolbar-left">
                    <span class="badge-count" id="resultCount">0 items</span>
                    <select id="filterType" class="filter-select">
                        <option value="all">All</option>
                        <option value="email">Emails</option>
                        <option value="phone">Phones</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Search..." class="search-input" />
                </div>
                <div class="toolbar-right">
                    <button id="copyAllBtn" class="btn-tool">Copy All</button>
                    <button id="exportCsvBtn" class="btn-tool">CSV</button>
                    <button id="exportJsonBtn" class="btn-tool">JSON</button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-wrap">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Contact</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody">
                        <tr class="empty-row">
                            <td colspan="4">No data extracted yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination-bar">
                <span id="paginationInfo">Showing 0-0 of 0</span>
                <div class="pagination-buttons">
                    <button id="prevPageBtn" disabled>← Prev</button>
                    <span id="pageIndicator" class="page-num">1</span>
                    <button id="nextPageBtn" disabled>Next →</button>
                </div>
            </div>

        </div>

    </div>

    <!-- JavaScript (অপরিবর্তিত) -->
    <script src="script.js"></script>
</body>
</html>
