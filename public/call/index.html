<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Call Campaign · Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="callCampaign" class="campaign-card w-full">

        <!-- ===== HEADER ===== -->
        <div class="campaign-header">
            <h1>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                Voice Call Campaign
            </h1>
            <div class="header-badge">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>

        <!-- ===== GRID ===== -->
        <div class="campaign-grid">

            <!-- LEFT: Controls -->
            <div class="controls-panel">

                <!-- Recipients -->
                <div class="form-group">
                    <label>📞 Recipients</label>
                    <div id="callDropZone" class="drop-zone">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p>Drop .txt or .csv</p>
                        <input type="file" id="callFileInput" accept=".txt,.csv" class="file-input" />
                    </div>
                    <div id="callFileInfo" class="file-info" style="display:none;">
                        <span id="callFileName" class="truncate"></span>
                        <span id="callFileCount">0 contacts</span>
                        <button id="callClearFileBtn" class="clear-btn">✕</button>
                    </div>
                </div>

                <!-- Voice Script -->
                <div class="form-group">
                    <label>🎙️ Voice Script</label>
                    <textarea id="callScript" rows="4" placeholder="Type your voice message script here..."></textarea>
                    <div class="script-counter">
                        <span id="callScriptCounter">0 / 300</span>
                        <span id="callScriptWarn" class="warn hidden">⚠️ Too long!</span>
                    </div>
                </div>

                <!-- Audio File -->
                <div class="form-group">
                    <label>🔊 Or Upload Audio File</label>
                    <input type="file" id="callAudioFile" accept=".mp3,.wav,.ogg" class="file-input-custom" />
                    <p class="helper-text">MP3, WAV or OGG (max 5MB)</p>
                </div>

                <!-- Caller ID -->
                <div class="form-group">
                    <label>📇 Caller ID</label>
                    <input type="text" id="callCallerId" placeholder="+1234567890" />
                    <p class="helper-text">Must be a valid phone number (E.164 format)</p>
                </div>

                <!-- Start Button -->
                <button id="startCallBtn" class="btn-start">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                    Start Broadcast
                </button>
                <div id="callStatus" class="status-box"></div>

            </div>

            <!-- RIGHT: Dashboard -->
            <div class="dashboard-panel">

                <!-- Header -->
                <div class="dashboard-header">
                    <h3>📊 Call Dashboard</h3>
                    <span class="badge-count" id="callResultCount">0 calls</span>
                </div>

                <!-- Progress -->
                <div id="callProgressContainer" class="progress-container">
                    <div class="progress-label">
                        <span id="callProgressLabel" class="font-semibold">Dialing...</span>
                        <span id="callProgressText" class="font-bold text-purple-600">0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="callProgressBar" class="progress-fill"></div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <p class="number" id="callTotalStat">0</p>
                        <p class="label">Total</p>
                    </div>
                    <div class="stat-item">
                        <p class="number green" id="callSuccessStat">0</p>
                        <p class="label">Success</p>
                    </div>
                    <div class="stat-item">
                        <p class="number red" id="callFailedStat">0</p>
                        <p class="label">Failed</p>
                    </div>
                    <div class="stat-item">
                        <p class="number amber" id="callPendingStat">0</p>
                        <p class="label">Pending</p>
                    </div>
                </div>

                <!-- Log Table -->
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Duration</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="callResultBody">
                            <tr class="empty-row">
                                <td colspan="4">No calls made yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Footer -->
                <div class="dashboard-footer">
                    <span id="callResultMeta">Ready</span>
                    <button id="callExportLogBtn" class="btn-export" disabled>Export Log</button>
                </div>

            </div>

        </div>

    </div>

    <!-- JavaScript (অপরিবর্তিত) -->
    <script src="script.js"></script>
</body>
</html>
