<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS Campaign · Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Minimal additional inline style (only if needed) -->
    <style>
        /* any tiny override if necessary */
    </style>
</head>
<body>

    <div class="campaign-card w-full" id="smsCampaign">

        <!-- ===== HEADER ===== -->
        <div class="campaign-header">
            <h1>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                SMS Campaign
            </h1>
            <div class="header-badge">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>

        <!-- ===== GRID: Left Controls + Right Dashboard ===== -->
        <div class="campaign-grid">

            <!-- LEFT PANEL -->
            <div class="controls-panel">

                <!-- Recipients Upload -->
                <div class="form-group">
                    <label>📱 Recipients</label>
                    <div id="smsDropZone" class="drop-zone">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p>Drop .txt or .csv file</p>
                        <input type="file" id="smsFileInput" accept=".txt,.csv" class="file-input" />
                    </div>
                    <div id="smsFileInfo" class="file-info" style="display:none;">
                        <span id="smsFileName">file.txt</span>
                        <span id="smsFileCount">0 contacts</span>
                        <button id="smsClearFileBtn" class="clear-btn">✕</button>
                    </div>
                </div>

                <!-- Message -->
                <div class="form-group">
                    <label>✉️ Message</label>
                    <textarea id="smsMessage" rows="4" placeholder="Type your SMS message..."></textarea>
                    <div class="char-counter">
                        <span id="smsCharCounter">0 / 160</span>
                        <span id="smsSegmentCounter">1 segment</span>
                    </div>
                    <div class="char-progress">
                        <div id="smsCharProgress" class="bar"></div>
                    </div>
                </div>

                <!-- Sender ID -->
                <div class="form-group">
                    <label>📇 Sender ID</label>
                    <input type="text" id="smsSenderId" placeholder="YourBrand" maxlength="11" />
                    <p class="text-[10px] text-slate-400 mt-1">Max 11 alphanumeric characters</p>
                </div>

                <!-- Provider -->
                <div class="form-group">
                    <label>🔌 Provider</label>
                    <select id="smsProvider">
                        <option value="default">Default (Saved API)</option>
                        <option value="twilio">Twilio</option>
                        <option value="vonage">Vonage</option>
                        <option value="africastalking">Africa's Talking</option>
                        <option value="custom">Custom HTTP</option>
                    </select>
                </div>

                <!-- Send Button -->
                <button id="sendSmsBtn" class="btn-send">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    Send SMS
                </button>
                <div id="smsStatus" class="status-box"></div>
            </div>

            <!-- RIGHT PANEL (Dashboard) -->
            <div class="dashboard-panel">

                <!-- Dashboard Header -->
                <div class="dashboard-header">
                    <h3>📊 SMS Dashboard</h3>
                    <span class="badge-count" id="smsResultCount">0 messages</span>
                </div>

                <!-- Progress -->
                <div id="smsProgressContainer" class="progress-container">
                    <div class="progress-label">
                        <span id="smsProgressLabel" class="font-medium">Sending...</span>
                        <span id="smsProgressText" class="text-purple-600 font-bold">0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="smsProgressBar" class="fill"></div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <p class="number" id="smsTotalStat">0</p>
                        <p class="label">Total</p>
                    </div>
                    <div class="stat-item">
                        <p class="number green" id="smsSuccessStat">0</p>
                        <p class="label">Success</p>
                    </div>
                    <div class="stat-item">
                        <p class="number red" id="smsFailedStat">0</p>
                        <p class="label">Failed</p>
                    </div>
                    <div class="stat-item">
                        <p class="number amber" id="smsPendingStat">0</p>
                        <p class="label">Pending</p>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Message ID</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="smsResultBody">
                            <tr class="empty-row">
                                <td colspan="4">No messages sent yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Footer -->
                <div class="dashboard-footer">
                    <span id="smsResultMeta">Ready</span>
                    <button id="smsExportLogBtn" class="btn-export" disabled>Export Log</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT (unchanged logic)                                 -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---- DOM refs ----
            const dropZone = document.getElementById('smsDropZone');
            const fileInput = document.getElementById('smsFileInput');
            const fileInfo = document.getElementById('smsFileInfo');
            const fileName = document.getElementById('smsFileName');
            const fileCount = document.getElementById('smsFileCount');
            const clearFileBtn = document.getElementById('smsClearFileBtn');

            const messageInput = document.getElementById('smsMessage');
            const charCounter = document.getElementById('smsCharCounter');
            const segmentCounter = document.getElementById('smsSegmentCounter');
            const charProgress = document.getElementById('smsCharProgress');

            const senderIdInput = document.getElementById('smsSenderId');
            const providerSelect = document.getElementById('smsProvider');
            const sendBtn = document.getElementById('sendSmsBtn');
            const statusDiv = document.getElementById('smsStatus');

            const progressContainer = document.getElementById('smsProgressContainer');
            const progressLabel = document.getElementById('smsProgressLabel');
            const progressText = document.getElementById('smsProgressText');
            const progressBar = document.getElementById('smsProgressBar');

            const totalStat = document.getElementById('smsTotalStat');
            const successStat = document.getElementById('smsSuccessStat');
            const failedStat = document.getElementById('smsFailedStat');
            const pendingStat = document.getElementById('smsPendingStat');
            const resultBody = document.getElementById('smsResultBody');
            const resultCount = document.getElementById('smsResultCount');
            const resultMeta = document.getElementById('smsResultMeta');
            const exportBtn = document.getElementById('smsExportLogBtn');

            // ---- State ----
            let uploadedContacts = [];
            let sentLog = [];
            let isSending = false;

            // ---- Helper: count characters and segments ----
            function analyzeMessage(text) {
                const len = text.length;
                let segments = 1;
                if (len <= 160) segments = 1;
                else if (len <= 306) segments = 2;
                else if (len <= 459) segments = 3;
                else segments = Math.ceil(len / 153);
                return { length: len, segments };
            }

            function updateMessageStats() {
                const text = messageInput.value;
                const { length, segments } = analyzeMessage(text);
                charCounter.textContent = `${length} / 160`;
                segmentCounter.textContent = `${segments} segment${segments > 1 ? 's' : ''}`;
                const percent = Math.min((length / 160) * 100, 100);
                charProgress.style.width = percent + '%';
                if (percent > 80) {
                    charProgress.style.background = '#ef4444';
                } else if (percent > 60) {
                    charProgress.style.background = '#f59e0b';
                } else {
                    charProgress.style.background = '#7c3aed';
                }
            }

            messageInput.addEventListener('input', updateMessageStats);

            // ---- File upload logic ----
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => { e.preventDefault();
                dropZone.classList.add('dragover'); });
            dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    handleFile(fileInput.files[0]);
                }
            });

            function handleFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    const lines = content.split(/\r?\n/).filter(line => line.trim() !== '');
                    let numbers = [];
                    if (file.name.endsWith('.csv')) {
                        lines.forEach(line => {
                            const parts = line.split(',').map(s => s.trim());
                            if (parts.length) numbers.push(parts[0]);
                        });
                    } else {
                        numbers = lines;
                    }
                    numbers = numbers.map(n => n.replace(/[^0-9+]/g, '')).filter(n => n.length > 0);
                    uploadedContacts = numbers;
                    if (uploadedContacts.length) {
                        fileInfo.style.display = 'flex';
                        fileName.textContent = file.name;
                        fileCount.textContent = `${uploadedContacts.length} contacts`;
                        dropZone.style.display = 'none';
                    } else {
                        alert('No valid phone numbers found.');
                    }
                };
                reader.readAsText(file);
            }

            clearFileBtn.addEventListener('click', function() {
                uploadedContacts = [];
                fileInfo.style.display = 'none';
                dropZone.style.display = 'block';
                fileInput.value = '';
            });

            // ---- Send SMS (simulated) ----
            sendBtn.addEventListener('click', function() {
                if (isSending) return;
                const message = messageInput.value.trim();
                const senderId = senderIdInput.value.trim() || 'YourBrand';
                const provider = providerSelect.value;
                if (!message) { showStatus('Please enter a message.', 'error'); return; }
                if (uploadedContacts.length === 0) { showStatus('Please upload recipients first.', 'error'); return; }

                isSending = true;
                sendBtn.disabled = true;
                sendBtn.innerHTML = '<span class="inline-block animate-spin mr-1">⟳</span> Sending...';
                statusDiv.style.display = 'none';

                progressContainer.style.display = 'block';
                progressLabel.textContent = 'Sending...';
                progressText.textContent = '0%';
                progressBar.style.width = '0%';

                const total = uploadedContacts.length;
                let success = 0,
                    failed = 0,
                    pending = 0;
                let sent = 0;
                const logEntries = [];

                function sendNext(index) {
                    if (index >= total) {
                        finish();
                        return;
                    }
                    const phone = uploadedContacts[index];
                    const isSuccess = Math.random() < 0.9;
                    const status = isSuccess ? 'success' : 'failed';
                    if (isSuccess) success++;
                    else failed++;
                    const messageId = isSuccess ? 'SM' + Date.now() + Math.floor(Math.random() * 1000) : null;
                    const entry = {
                        phone,
                        status,
                        messageId: messageId || '—',
                        time: new Date().toLocaleTimeString()
                    };
                    logEntries.push(entry);
                    sent++;

                    updateStats(total, success, failed, pending);
                    updateTable(logEntries);
                    resultCount.textContent = `${logEntries.length} messages`;

                    const pct = Math.round((sent / total) * 100);
                    progressText.textContent = pct + '%';
                    progressBar.style.width = pct + '%';
                    progressLabel.textContent = `Sending ${sent}/${total}`;

                    setTimeout(() => sendNext(index + 1), 200 + Math.random() * 300);
                }

                function finish() {
                    isSending = false;
                    sendBtn.disabled = false;
                    sendBtn.innerHTML =
                        '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg> Send SMS';
                    progressLabel.textContent = 'Completed!';
                    progressText.textContent = '100%';
                    progressBar.style.width = '100%';
                    showStatus(`✅ Sent ${success} successful, ${failed} failed.`, 'success');
                    exportBtn.disabled = false;
                    sentLog = logEntries;
                    updateStats(total, success, failed, 0);
                    updateTable(logEntries);
                    resultMeta.textContent = `Completed at ${new Date().toLocaleTimeString()}`;
                }

                sendNext(0);
            });

            function updateStats(total, success, failed, pending) {
                totalStat.textContent = total;
                successStat.textContent = success;
                failedStat.textContent = failed;
                pendingStat.textContent = pending;
            }

            function updateTable(entries) {
                resultBody.innerHTML = '';
                if (entries.length === 0) {
                    resultBody.innerHTML = '<tr class="empty-row"><td colspan="4">No messages sent yet.</td></tr>';
                    return;
                }
                entries.forEach(entry => {
                    const tr = document.createElement('tr');
                    const statusClass = entry.status === 'success' ? 'success' : (entry.status === 'failed' ? 'failed' :
                        'pending');
                    tr.innerHTML = `
                        <td>${escapeHtml(entry.phone)}</td>
                        <td><span class="status-badge ${statusClass}">${entry.status}</span></td>
                        <td>${escapeHtml(entry.messageId || '—')}</td>
                        <td>${escapeHtml(entry.time)}</td>
                    `;
                    resultBody.appendChild(tr);
                });
            }

            function showStatus(msg, type) {
                statusDiv.style.display = 'block';
                statusDiv.textContent = msg;
                statusDiv.style.borderLeftColor = type === 'error' ? '#ef4444' : '#10b981';
                statusDiv.style.background = type === 'error' ? '#fee2e2' : '#d1fae5';
                statusDiv.style.color = type === 'error' ? '#991b1b' : '#065f46';
            }

            function escapeHtml(str) {
                if (!str) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return str.replace(/[&<>"']/g, m => map[m]);
            }

            // ---- Export Log ----
            exportBtn.addEventListener('click', function() {
                if (sentLog.length === 0) return;
                let csv = 'Phone,Status,MessageID,Time\n';
                sentLog.forEach(entry => {
                    csv +=
                        `${entry.phone},${entry.status},${entry.messageId || ''},${entry.time}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sms_log_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            });

            // ---- Init ----
            updateMessageStats();
            updateStats(0, 0, 0, 0);
            updateTable([]);
            resultCount.textContent = '0 messages';
            resultMeta.textContent = 'Ready';

        })();
    </script>

</body>
</html>
