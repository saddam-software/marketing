<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS Campaign · Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <style>
        /* ----- Global Reset & Font ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #0f172a;
        }

        /* ----- Main Card (black border) ----- */
        .campaign-card {
            background: #ffffff;
            border-radius: 1.5rem;
            border: 2px solid #0b1120;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            max-width: 1280px;
            width: 100%;
            overflow: hidden;
            transition: box-shadow 0.25s ease;
        }
        .campaign-card:hover {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.45);
        }

        /* ----- Header (dark) ----- */
        .campaign-header {
            background: #0b1120;
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #0b1120;
            gap: 0.75rem;
        }
        .campaign-header h1 {
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .campaign-header h1 svg {
            width: 1.4rem;
            height: 1.4rem;
            stroke: #a78bfa;
        }
        .header-badge {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #1e293b;
            padding: 0.3rem 1rem;
            border-radius: 999px;
            border: 1px solid #334155;
        }
        .header-badge .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #10b981;
        }
        .header-badge .status-text {
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ----- Grid layout (2 columns) ----- */
        .campaign-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 0;
            background: #f8fafc;
        }
        @media (max-width: 1024px) {
            .campaign-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        /* ----- Left panel (controls) ----- */
        .controls-panel {
            background: #ffffff;
            padding: 1.8rem 1.5rem;
            border-right: 1px solid #e2e8f0;
        }
        @media (max-width: 1024px) {
            .controls-panel {
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
            }
        }

        .controls-panel .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .controls-panel .form-group {
            margin-bottom: 1.2rem;
        }
        .controls-panel .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.2rem;
        }
        .controls-panel .form-group input,
        .controls-panel .form-group select,
        .controls-panel .form-group textarea {
            width: 100%;
            padding: 0.5rem 0.8rem;
            border: 1px solid #d1d9e6;
            border-radius: 0.6rem;
            font-size: 0.85rem;
            background: white;
            transition: border 0.15s, box-shadow 0.15s;
            outline: none;
            color: #0f172a;
        }
        .controls-panel .form-group input:focus,
        .controls-panel .form-group select:focus,
        .controls-panel .form-group textarea:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        .controls-panel .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 0.6rem;
            padding: 1.2rem 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: #fafcff;
        }
        .drop-zone:hover {
            border-color: #7c3aed;
            background: #f5f3ff;
        }
        .drop-zone svg {
            width: 2rem;
            height: 2rem;
            color: #94a3b8;
            margin: 0 auto 0.2rem;
        }
        .drop-zone p {
            font-size: 0.75rem;
            color: #64748b;
        }
        .drop-zone .file-input {
            display: none;
        }

        .file-info {
            display: none;
            margin-top: 0.5rem;
            padding: 0.4rem 0.8rem;
            background: #f1f5f9;
            border-radius: 0.4rem;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-info .clear-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: 600;
            background: none;
            border: none;
            font-size: 0.8rem;
        }

        /* Char counter */
        .char-counter {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 0.2rem;
        }
        .char-progress {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 999px;
            margin-top: 0.2rem;
            overflow: hidden;
        }
        .char-progress .bar {
            height: 100%;
            background: #7c3aed;
            border-radius: 999px;
            transition: width 0.3s;
            width: 0%;
        }

        /* Send button */
        .btn-send {
            width: 100%;
            background: #7c3aed;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 0.6rem;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 6px -2px rgba(124, 58, 237, 0.3);
        }
        .btn-send:hover {
            background: #6d28d9;
        }
        .btn-send:active {
            transform: scale(0.97);
        }
        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Status message */
        .status-box {
            display: none;
            margin-top: 0.8rem;
            padding: 0.6rem 1rem;
            background: #f1f5f9;
            border-radius: 0.4rem;
            font-size: 0.8rem;
            color: #1e293b;
            border-left: 3px solid #7c3aed;
        }

        /* ----- Right panel (dashboard) ----- */
        .dashboard-panel {
            background: #ffffff;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }

        .dashboard-header {
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafcff;
        }
        .dashboard-header h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: #0f172a;
        }
        .dashboard-header .badge-count {
            background: #e2e8f0;
            padding: 0.1rem 0.7rem;
            border-radius: 999px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #1e293b;
        }

        /* Progress bar */
        .progress-container {
            display: none;
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }
        .progress-container .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: #334155;
        }
        .progress-container .progress-track {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            margin-top: 0.3rem;
            overflow: hidden;
        }
        .progress-container .progress-track .fill {
            height: 100%;
            background: #7c3aed;
            border-radius: 999px;
            transition: width 0.3s;
            width: 0%;
        }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }
        @media (max-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .number {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
        }
        .stat-item .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #94a3b8;
            font-weight: 700;
        }
        .stat-item .number.green {
            color: #10b981;
        }
        .stat-item .number.red {
            color: #ef4444;
        }
        .stat-item .number.amber {
            color: #f59e0b;
        }

        /* Table */
        .table-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem 1.5rem;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        .table-wrap table thead {
            border-bottom: 1px solid #e2e8f0;
        }
        .table-wrap table th {
            text-align: left;
            padding: 0.4rem 0.3rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            font-size: 0.6rem;
            letter-spacing: 0.3px;
        }
        .table-wrap table td {
            padding: 0.4rem 0.3rem;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            vertical-align: middle;
        }
        .table-wrap table tr:last-child td {
            border-bottom: none;
        }
        .table-wrap .empty-row td {
            text-align: center;
            color: #94a3b8;
            padding: 2rem 0;
        }

        .status-badge {
            display: inline-block;
            padding: 0.05rem 0.5rem;
            border-radius: 999px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-badge.success {
            background: #d1fae5;
            color: #065f46;
        }
        .status-badge.failed {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        /* Footer */
        .dashboard-footer {
            padding: 0.5rem 1.5rem;
            border-top: 1px solid #e2e8f0;
            background: #fafcff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            color: #64748b;
        }
        .dashboard-footer .btn-export {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 0.3rem;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .dashboard-footer .btn-export:hover {
            background: #059669;
        }
        .dashboard-footer .btn-export:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* scrollbar */
        .table-wrap::-webkit-scrollbar {
            width: 4px;
        }
        .table-wrap::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .table-wrap::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* responsive tweaks */
        @media (max-width: 640px) {
            .campaign-header {
                flex-direction: column;
                align-items: stretch;
            }
            .controls-panel {
                padding: 1rem;
            }
            .dashboard-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.3rem;
            }
            .table-wrap {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="campaign-card" id="smsCampaign">

        <!-- ===== HEADER ===== -->
        <div class="campaign-header">
            <h1>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                SMS Campaign
            </h1>
            <div class="header-badge">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>

        <!-- ===== GRID: Left Controls + Right Dashboard ===== -->
        <div class="campaign-grid">

            <!-- LEFT PANEL -->
            <div class="controls-panel">

                <!-- Recipients Upload -->
                <div class="form-group">
                    <label>📱 Recipients</label>
                    <div id="smsDropZone" class="drop-zone">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p>Drop .txt or .csv file</p>
                        <input type="file" id="smsFileInput" accept=".txt,.csv" class="file-input" />
                    </div>
                    <div id="smsFileInfo" class="file-info" style="display:none;">
                        <span id="smsFileName">file.txt</span>
                        <span id="smsFileCount">0 contacts</span>
                        <button id="smsClearFileBtn" class="clear-btn">✕</button>
                    </div>
                </div>

                <!-- Message -->
                <div class="form-group">
                    <label>✉️ Message</label>
                    <textarea id="smsMessage" rows="4" placeholder="Type your SMS message..."></textarea>
                    <div class="char-counter">
                        <span id="smsCharCounter">0 / 160</span>
                        <span id="smsSegmentCounter">1 segment</span>
                    </div>
                    <div class="char-progress">
                        <div id="smsCharProgress" class="bar"></div>
                    </div>
                </div>

                <!-- Sender ID -->
                <div class="form-group">
                    <label>📇 Sender ID</label>
                    <input type="text" id="smsSenderId" placeholder="YourBrand" maxlength="11" />
                    <p class="text-[10px] text-slate-400 mt-1">Max 11 alphanumeric characters</p>
                </div>

                <!-- Provider -->
                <div class="form-group">
                    <label>🔌 Provider</label>
                    <select id="smsProvider">
                        <option value="default">Default (Saved API)</option>
                        <option value="twilio">Twilio</option>
                        <option value="vonage">Vonage</option>
                        <option value="africastalking">Africa's Talking</option>
                        <option value="custom">Custom HTTP</option>
                    </select>
                </div>

                <!-- Send Button -->
                <button id="sendSmsBtn" class="btn-send">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    Send SMS
                </button>
                <div id="smsStatus" class="status-box"></div>
            </div>

            <!-- RIGHT PANEL (Dashboard) -->
            <div class="dashboard-panel">

                <!-- Dashboard Header -->
                <div class="dashboard-header">
                    <h3>📊 SMS Dashboard</h3>
                    <span class="badge-count" id="smsResultCount">0 messages</span>
                </div>

                <!-- Progress -->
                <div id="smsProgressContainer" class="progress-container">
                    <div class="progress-label">
                        <span id="smsProgressLabel" class="font-medium">Sending...</span>
                        <span id="smsProgressText" class="text-purple-600 font-bold">0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="smsProgressBar" class="fill"></div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <p class="number" id="smsTotalStat">0</p>
                        <p class="label">Total</p>
                    </div>
                    <div class="stat-item">
                        <p class="number green" id="smsSuccessStat">0</p>
                        <p class="label">Success</p>
                    </div>
                    <div class="stat-item">
                        <p class="number red" id="smsFailedStat">0</p>
                        <p class="label">Failed</p>
                    </div>
                    <div class="stat-item">
                        <p class="number amber" id="smsPendingStat">0</p>
                        <p class="label">Pending</p>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Message ID</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="smsResultBody">
                            <tr class="empty-row">
                                <td colspan="4">No messages sent yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Footer -->
                <div class="dashboard-footer">
                    <span id="smsResultMeta">Ready</span>
                    <button id="smsExportLogBtn" class="btn-export" disabled>Export Log</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT — Full functionality (kept identical logic)         -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---- DOM refs ----
            const dropZone = document.getElementById('smsDropZone');
            const fileInput = document.getElementById('smsFileInput');
            const fileInfo = document.getElementById('smsFileInfo');
            const fileName = document.getElementById('smsFileName');
            const fileCount = document.getElementById('smsFileCount');
            const clearFileBtn = document.getElementById('smsClearFileBtn');

            const messageInput = document.getElementById('smsMessage');
            const charCounter = document.getElementById('smsCharCounter');
            const segmentCounter = document.getElementById('smsSegmentCounter');
            const charProgress = document.getElementById('smsCharProgress');

            const senderIdInput = document.getElementById('smsSenderId');
            const providerSelect = document.getElementById('smsProvider');
            const sendBtn = document.getElementById('sendSmsBtn');
            const statusDiv = document.getElementById('smsStatus');

            const progressContainer = document.getElementById('smsProgressContainer');
            const progressLabel = document.getElementById('smsProgressLabel');
            const progressText = document.getElementById('smsProgressText');
            const progressBar = document.getElementById('smsProgressBar');

            const totalStat = document.getElementById('smsTotalStat');
            const successStat = document.getElementById('smsSuccessStat');
            const failedStat = document.getElementById('smsFailedStat');
            const pendingStat = document.getElementById('smsPendingStat');
            const resultBody = document.getElementById('smsResultBody');
            const resultCount = document.getElementById('smsResultCount');
            const resultMeta = document.getElementById('smsResultMeta');
            const exportBtn = document.getElementById('smsExportLogBtn');

            // ---- State ----
            let uploadedContacts = [];
            let sentLog = [];
            let isSending = false;

            // ---- Helper: count characters and segments (GSM 7-bit) ----
            function analyzeMessage(text) {
                const len = text.length;
                const gsm7 = /^[A-Za-z0-9 \r\n@£$¥èéùìòÇØøÅå_ÆæßÉ!\"#$%&'()*+,\-./:;<=>?¡ÄÖÑÜ§¿äöñüà^{}\[~]|€]*$/;
                let segments = 1;
                if (len <= 160) segments = 1;
                else if (len <= 306) segments = 2;
                else if (len <= 459) segments = 3;
                else segments = Math.ceil(len / 153);
                return { length: len, segments };
            }

            function updateMessageStats() {
                const text = messageInput.value;
                const { length, segments } = analyzeMessage(text);
                charCounter.textContent = `${length} / 160`;
                segmentCounter.textContent = `${segments} segment${segments > 1 ? 's' : ''}`;
                const percent = Math.min((length / 160) * 100, 100);
                charProgress.style.width = percent + '%';
                if (percent > 80) {
                    charProgress.style.background = '#ef4444';
                } else if (percent > 60) {
                    charProgress.style.background = '#f59e0b';
                } else {
                    charProgress.style.background = '#7c3aed';
                }
            }

            messageInput.addEventListener('input', updateMessageStats);

            // ---- File upload logic ----
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => { e.preventDefault();
                dropZone.style.borderColor = '#7c3aed'; });
            dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#cbd5e1'; });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = '#cbd5e1';
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    handleFile(fileInput.files[0]);
                }
            });

            function handleFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    const lines = content.split(/\r?\n/).filter(line => line.trim() !== '');
                    let numbers = [];
                    // try to parse CSV or plain list
                    if (file.name.endsWith('.csv')) {
                        // simple: take first column
                        lines.forEach(line => {
                            const parts = line.split(',').map(s => s.trim());
                            if (parts.length) numbers.push(parts[0]);
                        });
                    } else {
                        numbers = lines;
                    }
                    // clean numbers (remove non-digit except '+')
                    numbers = numbers.map(n => n.replace(/[^0-9+]/g, '')).filter(n => n.length > 0);
                    uploadedContacts = numbers;
                    if (uploadedContacts.length) {
                        fileInfo.style.display = 'flex';
                        fileName.textContent = file.name;
                        fileCount.textContent = `${uploadedContacts.length} contacts`;
                        dropZone.style.display = 'none';
                    } else {
                        alert('No valid phone numbers found.');
                    }
                };
                reader.readAsText(file);
            }

            clearFileBtn.addEventListener('click', function() {
                uploadedContacts = [];
                fileInfo.style.display = 'none';
                dropZone.style.display = 'block';
                fileInput.value = '';
            });

            // ---- Send SMS (simulated) ----
            sendBtn.addEventListener('click', function() {
                if (isSending) return;
                const message = messageInput.value.trim();
                const senderId = senderIdInput.value.trim() || 'YourBrand';
                const provider = providerSelect.value;
                if (!message) { showStatus('Please enter a message.', 'error'); return; }
                if (uploadedContacts.length === 0) { showStatus('Please upload recipients first.', 'error'); return; }

                // Simulate sending
                isSending = true;
                sendBtn.disabled = true;
                sendBtn.innerHTML = '<span class="inline-block animate-spin mr-1">⟳</span> Sending...';
                statusDiv.style.display = 'none';

                // Reset progress
                progressContainer.style.display = 'block';
                progressLabel.textContent = 'Sending...';
                progressText.textContent = '0%';
                progressBar.style.width = '0%';

                const total = uploadedContacts.length;
                let success = 0,
                    failed = 0,
                    pending = 0;
                let sent = 0;
                const logEntries = [];

                // Simulate each send with random delay
                function sendNext(index) {
                    if (index >= total) {
                        // done
                        finish();
                        return;
                    }
                    const phone = uploadedContacts[index];
                    // Simulate success/failure (90% success)
                    const isSuccess = Math.random() < 0.9;
                    const status = isSuccess ? 'success' : 'failed';
                    if (isSuccess) success++;
                    else failed++;
                    const messageId = isSuccess ? 'SM' + Date.now() + Math.floor(Math.random() * 1000) : null;
                    const entry = {
                        phone,
                        status,
                        messageId: messageId || '—',
                        time: new Date().toLocaleTimeString()
                    };
                    logEntries.push(entry);
                    sent++;

                    // update stats
                    updateStats(total, success, failed, pending);
                    updateTable(logEntries);
                    resultCount.textContent = `${logEntries.length} messages`;

                    // progress
                    const pct = Math.round((sent / total) * 100);
                    progressText.textContent = pct + '%';
                    progressBar.style.width = pct + '%';
                    progressLabel.textContent = `Sending ${sent}/${total}`;

                    // next with random delay 200-500ms
                    setTimeout(() => sendNext(index + 1), 200 + Math.random() * 300);
                }

                function finish() {
                    isSending = false;
                    sendBtn.disabled = false;
                    sendBtn.innerHTML =
                        '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg> Send SMS';
                    progressLabel.textContent = 'Completed!';
                    progressText.textContent = '100%';
                    progressBar.style.width = '100%';
                    showStatus(`✅ Sent ${success} successful, ${failed} failed.`, 'success');
                    exportBtn.disabled = false;
                    sentLog = logEntries;
                    updateStats(total, success, failed, 0);
                    // update table with final statuses
                    updateTable(logEntries);
                    resultMeta.textContent = `Completed at ${new Date().toLocaleTimeString()}`;
                }

                // start
                sendNext(0);
            });

            function updateStats(total, success, failed, pending) {
                totalStat.textContent = total;
                successStat.textContent = success;
                failedStat.textContent = failed;
                pendingStat.textContent = pending;
            }

            function updateTable(entries) {
                resultBody.innerHTML = '';
                if (entries.length === 0) {
                    resultBody.innerHTML = '<tr class="empty-row"><td colspan="4">No messages sent yet.</td></tr>';
                    return;
                }
                entries.forEach(entry => {
                    const tr = document.createElement('tr');
                    const statusClass = entry.status === 'success' ? 'success' : (entry.status === 'failed' ? 'failed' :
                        'pending');
                    tr.innerHTML = `
                        <td>${escapeHtml(entry.phone)}</td>
                        <td><span class="status-badge ${statusClass}">${entry.status}</span></td>
                        <td>${escapeHtml(entry.messageId || '—')}</td>
                        <td>${escapeHtml(entry.time)}</td>
                    `;
                    resultBody.appendChild(tr);
                });
            }

            function showStatus(msg, type) {
                statusDiv.style.display = 'block';
                statusDiv.textContent = msg;
                statusDiv.style.borderLeftColor = type === 'error' ? '#ef4444' : '#10b981';
                statusDiv.style.background = type === 'error' ? '#fee2e2' : '#d1fae5';
                statusDiv.style.color = type === 'error' ? '#991b1b' : '#065f46';
            }

            function escapeHtml(str) {
                if (!str) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return str.replace(/[&<>"']/g, m => map[m]);
            }

            // ---- Export Log ----
            exportBtn.addEventListener('click', function() {
                if (sentLog.length === 0) return;
                let csv = 'Phone,Status,MessageID,Time\n';
                sentLog.forEach(entry => {
                    csv +=
                        `${entry.phone},${entry.status},${entry.messageId || ''},${entry.time}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sms_log_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            });

            // ---- Init ----
            updateMessageStats();
            updateStats(0, 0, 0, 0);
            updateTable([]);
            resultCount.textContent = '0 messages';
            resultMeta.textContent = 'Ready';

            // ---- Optional: reset on new file ----
            console.log('SMS Campaign initialized.');

        })();
    </script>

</body>
</html>
