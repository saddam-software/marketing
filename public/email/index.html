<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Campaign · Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

   <div id="emailCampaign" class="campaign-card max-w-6xl mx-auto w-full">
       
        <!-- ===== HEADER ===== -->
        <div class="campaign-header">
            <h1>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                Email Campaign
            </h1>
            <div class="header-badge">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>

        <!-- ===== BODY ===== -->
        <div class="campaign-body">

            <!-- Row 1: Sender, Subject, Provider -->
            <div class="form-row-3">
                <div class="form-group">
                    <label>📤 Sender</label>
                    <input type="email" id="emailSender" placeholder="hello@domain.com" />
                </div>
                <div class="form-group">
                    <label>📌 Subject</label>
                    <input type="text" id="emailSubject" placeholder="Email Subject..." />
                </div>
                <div class="form-group">
                    <label>⚙️ Provider</label>
                    <select id="emailProvider">
                        <option value="default">Default API</option>
                        <option value="brevo">Brevo (Sendinblue)</option>
                        <option value="sendgrid">SendGrid</option>
                        <option value="mailgun">Mailgun</option>
                        <option value="smtp">SMTP</option>
                    </select>
                </div>
            </div>

            <!-- Row 2: Recipients + HTML Editor -->
            <div class="form-row-2">

                <!-- Left: Recipients -->
                <div class="recipients-panel">
                    <label>📋 Recipients</label>
                    <div id="emailDropZone" class="drop-zone">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p>Drop .txt or .csv</p>
                        <input type="file" id="emailFileInput" accept=".txt,.csv" class="file-input" />
                    </div>
                    <div id="emailFileInfo" class="file-info" style="display:none;">
                        <span id="emailFileName" class="truncate"></span>
                        <span id="emailFileCount">0 contacts</span>
                        <button id="emailClearFileBtn" class="clear-btn">✕</button>
                    </div>
                    <select id="emailFilter" class="filter-select">
                        <option value="all">All Contacts</option>
                        <option value="b2b">B2B (Business)</option>
                        <option value="b2c">B2C (Personal)</option>
                        <option value="verified">Verified Only</option>
                    </select>
                </div>

                <!-- Right: HTML Editor -->
                <div class="editor-panel">
                    <div class="editor-header">
                        <label>✏️ HTML Content</label>
                        <span class="counter" id="emailHtmlLength">0 characters</span>
                        <button id="emailPreviewBtn" class="preview-btn">Preview</button>
                    </div>
                    <div class="editor-toolbar">
                        <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
                        <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
                        <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
                        <span class="divider"></span>
                        <button type="button" data-cmd="h1">H1</button>
                        <button type="button" data-cmd="h2">H2</button>
                        <span class="divider"></span>
                        <button type="button" data-cmd="link">🔗</button>
                        <button type="button" data-cmd="ul">• List</button>
                        <button type="button" data-cmd="variable" class="var-btn">{ Var }</button>
                    </div>
                    <textarea id="emailHtmlContent" rows="6" placeholder="<h1>Hello {{name}}</h1><p>Your content here</p>"></textarea>
                </div>

            </div>

            <!-- Action Row -->
            <div class="action-row">
                <div id="emailStatus" class="status-box"></div>
                <button id="sendEmailBtn" class="btn-send">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    Send Campaign
                </button>
            </div>

        </div>

        <!-- ===== PROGRESS ===== -->
        <div id="emailProgressContainer" class="progress-container">
            <div class="progress-label">
                <span id="emailProgressLabel" class="font-semibold">Sending emails...</span>
                <span id="emailProgressText" class="font-bold text-blue-600">0%</span>
            </div>
            <div class="progress-track">
                <div id="emailProgressBar" class="progress-fill"></div>
            </div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="label">Total</span>
                <span class="value" id="emailTotalStat">0</span>
            </div>
            <div class="stat-item">
                <span class="dot green"></span>
                <span class="label">Success</span>
                <span class="value green" id="emailSuccessStat">0</span>
            </div>
            <div class="stat-item">
                <span class="dot red"></span>
                <span class="label">Failed</span>
                <span class="value red" id="emailFailedStat">0</span>
            </div>
            <div class="stat-item">
                <span class="dot amber"></span>
                <span class="label">Pending</span>
                <span class="value amber" id="emailPendingStat">0</span>
            </div>
        </div>

        <!-- ===== LOG ===== -->
        <div class="log-section">
            <div class="log-header">
                <div class="log-left">
                    <span>📧 Email Log</span>
                    <span class="badge-count" id="emailResultCount">0 emails</span>
                </div>
                <div class="log-right">
                    <span id="emailResultMeta" class="meta-text">Ready</span>
                    <button id="emailExportLogBtn" class="btn-export" disabled>Export Log (CSV)</button>
                </div>
            </div>
            <div class="log-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Status</th>
                            <th class="hidden sm:table-cell">Message ID</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="emailResultBody">
                        <tr class="empty-row">
                            <td colspan="4">No emails sent yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ===== PREVIEW MODAL ===== -->
    <div id="emailPreviewModal" class="preview-modal hidden">
        <div class="preview-modal-content">
            <div class="preview-modal-header">
                <h3>📧 Email Preview</h3>
                <button id="emailPreviewClose" class="close-btn">✕</button>
            </div>
            <div id="emailPreviewContent" class="preview-body"></div>
        </div>
    </div>

    <!-- JavaScript (অপরিবর্তিত) -->
    <script src="script.js"></script>
</body>
</html>
