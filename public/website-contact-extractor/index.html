<div id="websiteContactExtractor" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
  
  <div class="p-4 md:p-5 bg-slate-50/50 border-b border-slate-200 flex flex-col gap-4">
    
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
        </div>
        <input type="url" id="websiteUrl" placeholder="https://example.com" class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
      </div>
      <button id="websiteScrapeBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-2 rounded-lg transition-all flex items-center justify-center gap-2 whitespace-nowrap shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        Start Scraping
      </button>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex items-center gap-2">
          <label class="font-semibold text-slate-700">Limit:</label>
          <input type="number" id="websiteLimit" value="100" min="1" max="10000" class="w-16 border border-slate-300 rounded px-2 py-1 text-center focus:ring-1 focus:ring-blue-500 outline-none" />
        </div>
        <div class="flex items-center gap-2">
          <label class="font-semibold text-slate-700">Depth:</label>
          <input type="number" id="websiteDepth" value="1" min="1" max="3" class="w-12 border border-slate-300 rounded px-2 py-1 text-center focus:ring-1 focus:ring-blue-500 outline-none" />
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-4">
        <label class="flex items-center gap-1.5 cursor-pointer group">
          <input type="checkbox" id="forceWebsiteScrape" class="w-3.5 h-3.5 text-blue-600 border-slate-300 rounded focus:ring-blue-500" />
          <span class="text-slate-600 font-medium group-hover:text-blue-600 transition-colors">Ignore Cache</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer group">
          <input type="checkbox" id="includeSubdomains" class="w-3.5 h-3.5 text-blue-600 border-slate-300 rounded focus:ring-blue-500" />
          <span class="text-slate-600 font-medium group-hover:text-blue-600 transition-colors">Subdomains</span>
        </label>
      </div>
    </div>
    
    <div id="websiteStatus" class="hidden px-3 py-2 rounded-lg text-xs font-medium text-center"></div>
  </div>

  <div id="websiteProgressContainer" class="hidden bg-blue-50 p-2 sm:p-3 border-b border-blue-100">
    <div class="flex items-center gap-3">
      <div class="spinner w-4 h-4 border-2 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xs font-semibold text-slate-700 hidden sm:inline" id="websiteProgressLabel">Scraping...</span>
        <div class="flex-1 bg-slate-200 rounded-full h-1.5">
          <div id="websiteProgressBar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-300" style="width:0%"></div>
        </div>
      </div>
      <span id="websiteProgressText" class="font-bold text-blue-600 text-xs">0%</span>
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-2 p-2 px-4 border-b border-slate-200 bg-white">
    <div class="flex items-center gap-2">
      <button class="website-tab-btn active px-3 py-1.5 text-xs font-semibold text-slate-500 border-b-2 border-transparent" data-tab="emails">📧 Emails</button>
      <button class="website-tab-btn px-3 py-1.5 text-xs font-semibold text-slate-500 border-b-2 border-transparent" data-tab="phones">📱 Phones</button>
      <span id="websiteResultCount" class="ml-2 text-[10px] bg-slate-100 border border-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-bold">0 items</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span id="websiteResultMeta" class="text-[10px] text-slate-400 mr-2 hidden sm:inline">Ready to scrape</span>
      <button id="websiteCopyAllBtn" class="px-2.5 py-1.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 text-xs font-semibold rounded-md transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>Copy All</button>
      <button id="websiteExportCsv" class="px-2.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 text-xs font-semibold rounded-md transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>CSV</button>
    </div>
  </div>

  <div class="table-scroll h-64 overflow-y-auto bg-white">
    <div id="websiteEmailsTab" class="website-tab-content h-full">
      <div class="h-full flex flex-col items-center justify-center text-sm text-slate-400 py-10">
        <svg class="w-8 h-8 mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        No emails extracted yet.
      </div>
    </div>
    <div id="websitePhonesTab" class="website-tab-content hidden h-full">
      <div class="h-full flex flex-col items-center justify-center text-sm text-slate-400 py-10">
        <svg class="w-8 h-8 mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        No phone numbers extracted yet.
      </div>
    </div>
  </div>
</div>
