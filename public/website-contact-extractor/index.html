<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Contact Extractor · Pro</title>

    <!-- Tailwind CSS (শুধু ইউটিলিটি) -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="websiteContactExtractor" class="extractor-card">

        <!-- ===== HEADER (ডার্ক) ===== -->
        <div class="extractor-header">
            <h1>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
                Website Contact Extractor
            </h1>
            <div class="header-badge">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>

        <!-- ===== BODY: Input Section ===== -->
        <div class="extractor-body">

            <!-- URL Input + Scrape Button -->
            <div class="input-row">
                <div class="url-input-wrapper">
                    <svg class="url-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
                    <input type="url" id="websiteUrl" placeholder="https://example.com" />
                </div>
                <button id="websiteScrapeBtn" class="btn-primary">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    Start Scraping
                </button>
            </div>

            <!-- Settings Row -->
            <div class="settings-row">
                <div class="setting-group">
                    <label for="websiteLimit">Limit:</label>
                    <input type="number" id="websiteLimit" value="100" min="1" max="10000" />
                </div>
                <div class="setting-group">
                    <label for="websiteDepth">Depth:</label>
                    <input type="number" id="websiteDepth" value="1" min="1" max="3" />
                </div>
                <label class="setting-check">
                    <input type="checkbox" id="forceWebsiteScrape" />
                    <span>Ignore Cache</span>
                </label>
                <label class="setting-check">
                    <input type="checkbox" id="includeSubdomains" />
                    <span>Subdomains</span>
                </label>
            </div>

            <!-- Status -->
            <div id="websiteStatus" class="status-box"></div>

        </div>

        <!-- ===== PROGRESS BAR ===== -->
        <div id="websiteProgressContainer" class="progress-container">
            <div class="progress-label">
                <span id="websiteProgressLabel" class="font-semibold">Scraping...</span>
                <span id="websiteProgressText" class="font-bold text-blue-600">0%</span>
            </div>
            <div class="progress-track">
                <div id="websiteProgressBar" class="progress-fill"></div>
            </div>
        </div>

        <!-- ===== RESULTS TOOLBAR ===== -->
        <div class="results-toolbar">
            <div class="toolbar-left">
                <button class="tab-btn active" data-tab="emails">📧 Emails</button>
                <button class="tab-btn" data-tab="phones">📱 Phones</button>
                <span class="badge-count" id="websiteResultCount">0 items</span>
            </div>
            <div class="toolbar-right">
                <span id="websiteResultMeta" class="meta-text">Ready to scrape</span>
                <button id="websiteCopyAllBtn" class="btn-tool" disabled>Copy All</button>
                <button id="websiteExportCsv" class="btn-tool" disabled>CSV</button>
            </div>
        </div>

        <!-- ===== TAB CONTENT (Table) ===== -->
        <div class="table-wrap">
            <!-- Emails Tab -->
            <div id="websiteEmailsTab" class="tab-content active">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    No emails extracted yet.
                </div>
            </div>
            <!-- Phones Tab -->
            <div id="websitePhonesTab" class="tab-content hidden">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    No phone numbers extracted yet.
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
