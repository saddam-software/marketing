<div id="websiteContactExtractor" class="website-extractor-card w-full">

  <div class="we-header">
    <h1>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/>
      </svg>
      Website Contact Extractor
    </h1>
    <div class="we-header-badge">
      <span class="we-status-dot"></span>
      <span class="we-status-text">Ready</span>
    </div>
  </div>

  <div class="we-input-section">
    <div class="we-url-row">
      <div class="we-url-wrapper">
        <svg class="we-url-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/>
        </svg>
        <input type="url" id="websiteUrl" placeholder="https://example.com" class="we-url-input" required />
      </div>
      <button id="websiteScrapeBtn" class="we-btn-primary">
        <svg class="we-btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Start Scraping
      </button>
    </div>

    <div class="we-options-row">
      <div class="we-option-group">
        <label class="we-option-label" for="websiteLimit">Limit:</label>
        <input type="number" id="websiteLimit" value="100" min="1" max="10000" class="we-input-small" />
      </div>
      <div class="we-option-group">
        <label class="we-option-label" for="websiteDepth">Depth:</label>
        <input type="number" id="websiteDepth" value="1" min="1" max="3" class="we-input-small" />
      </div>
      <div class="we-option-group we-check-group">
        <label class="we-check-label">
          <input type="checkbox" id="forceWebsiteScrape" class="we-checkbox" />
          <span>Ignore Cache</span>
        </label>
        <label class="we-check-label">
          <input type="checkbox" id="includeSubdomains" class="we-checkbox" />
          <span>Subdomains</span>
        </label>
      </div>
    </div>

    <div id="websiteStatus" class="we-status-box hidden"></div>
  </div>

  <div id="websiteProgressContainer" class="we-progress-container hidden">
    <div class="we-progress-inner">
      <div class="we-spinner"></div>
      <div class="we-progress-track">
        <span id="websiteProgressLabel" class="we-progress-label">Analyzing context & scraping...</span>
        <div class="we-progress-bar-bg">
          <div id="websiteProgressBar" class="we-progress-bar-fill" style="width:0%"></div>
        </div>
      </div>
      <span id="websiteProgressText" class="we-progress-percent">0%</span>
    </div>
  </div>

  <div class="we-results-header">
    <div class="we-results-left">
      <button class="we-tab-btn active" data-tab="emails">📧 Emails</button>
      <button class="we-tab-btn" data-tab="phones">📱 Phones</button>
      <span id="websiteResultCount" class="we-badge-count">0 items</span>
    </div>
    <div class="we-results-right">
      <span id="websiteResultMeta" class="we-result-meta">Ready to scrape</span>
      <button id="websiteCopyAllBtn" class="we-btn-tool" disabled>Copy All</button>
      <button id="websiteExportCsv" class="we-btn-tool" disabled>CSV</button>
    </div>
  </div>

  <div class="we-tab-content-wrap" style="background: #fdfdfd; min-height: 200px;">
    
    <div id="websiteEmailsTab" class="we-tab-panel">
      <div class="we-empty-state">
        <svg class="we-empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        No emails extracted yet.
      </div>
    </div>

    <div id="websitePhonesTab" class="we-tab-panel hidden">
      <div class="we-empty-state">
        <svg class="we-empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
        No phone numbers extracted yet.
      </div>
    </div>
    
  </div>

</div>

<script src="script.js"></script>
