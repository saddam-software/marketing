<!-- public/website-contact-extractor/index.html -->
<div id="websiteContactExtractor" class="space-y-6">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Control Panel -->
    <div class="lg:col-span-1">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 sticky-top-24">
        <h3 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
          Website URL Extractor
        </h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Website URL</label>
            <input type="url" id="websiteUrl" placeholder="https://example.com" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Limit</label>
              <input type="number" id="websiteLimit" value="100" min="1" max="10000" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Depth</label>
              <input type="number" id="websiteDepth" value="1" min="1" max="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
            </div>
          </div>
          <div>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="forceWebsiteScrape" class="w-4 h-4 text-blue-600" />
              <span class="text-xs text-slate-700">Ignore Cache (Force new scrape)</span>
            </label>
          </div>
          <div>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="includeSubdomains" class="w-4 h-4 text-blue-600" />
              <span class="text-xs text-slate-700">Include subdomains</span>
            </label>
          </div>
          <button id="websiteScrapeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow-md flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            Start Scraping
          </button>
          <div id="websiteStatus" class="hidden p-3 bg-slate-50 rounded-lg text-sm text-slate-600"></div>
        </div>
      </div>
    </div>

    <!-- Results Panel -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[550px]">
        <div class="p-4 border-b border-slate-200 bg-slate-50/80 rounded-t-xl flex items-center justify-between">
          <h3 class="font-semibold text-slate-800">🌐 Scraped Data</h3>
          <span id="websiteResultCount" class="text-xs bg-slate-200 text-slate-600 px-2.5 py-0.5 rounded-full">0 items</span>
        </div>

        <!-- Progress -->
        <div id="websiteProgressContainer" class="hidden p-4 border-b border-slate-200 bg-white">
          <div class="flex justify-between text-sm mb-2">
            <span id="websiteProgressLabel" class="font-medium text-slate-700">Scraping...</span>
            <span id="websiteProgressText" class="text-blue-600 font-bold">0%</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
            <div id="websiteProgressBar" class="bg-blue-600 h-2.5 rounded-full progress-bar-fill" style="width:0%"></div>
          </div>
        </div>

        <!-- Data Table with tabs -->
        <div class="flex-1 overflow-hidden flex flex-col">
          <div class="flex border-b border-slate-200 bg-white px-4">
            <button class="website-tab-btn active px-4 py-2 text-sm font-medium text-blue-600 border-b-2 border-blue-600" data-tab="emails">📧 Emails</button>
            <button class="website-tab-btn px-4 py-2 text-sm font-medium text-slate-600 hover:text-blue-600 border-b-2 border-transparent hover:border-blue-400" data-tab="phones">📱 Phones</button>
          </div>
          <div class="flex-1 overflow-y-auto p-4">
            <div id="websiteEmailsTab" class="website-tab-content">
              <div class="text-sm text-slate-500 text-center py-12">No emails extracted yet.</div>
            </div>
            <div id="websitePhonesTab" class="website-tab-content hidden">
              <div class="text-sm text-slate-500 text-center py-12">No phone numbers extracted yet.</div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="p-3 border-t border-slate-200 bg-slate-50/80 rounded-b-xl text-xs text-slate-500 flex justify-between items-center">
          <span id="websiteResultMeta">Ready to scrape</span>
          <div class="flex gap-2">
            <button id="websiteCopyAllBtn" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-lg transition-all disabled:opacity-50" disabled>Copy All</button>
            <button id="websiteExportCsv" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg transition-all disabled:opacity-50" disabled>Export CSV</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
