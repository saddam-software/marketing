<!-- public/location-contact-search/index.html -->
<div id="locationContactSearch" class="space-y-6">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Control Panel -->
    <div class="lg:col-span-1">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 sticky-top-24">
        <h3 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Location-Based Search
        </h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">জেলা (District)</label>
            <select id="districtSelect" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
              <option value="">— Select District —</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">থানা (Thana)</label>
            <select id="thanaSelect" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" disabled>
              <option value="">— Select Thana —</option>
            </select>
          </div>
          <button id="searchLocationBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow-md flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            Search Contacts
          </button>
          <div id="locationSearchStatus" class="hidden p-3 bg-slate-50 rounded-lg text-sm text-slate-600"></div>
        </div>
      </div>
    </div>

    <!-- Results Panel -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[500px]">
        <div class="p-4 border-b border-slate-200 bg-slate-50/80 rounded-t-xl flex items-center justify-between">
          <h3 class="font-semibold text-slate-800">📍 Contacts</h3>
          <span id="locationResultCount" class="text-xs bg-slate-200 text-slate-600 px-2.5 py-0.5 rounded-full">0 contacts</span>
        </div>
        <div class="flex-1 overflow-y-auto p-4">
          <table class="data-table w-full" id="locationResultTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Thana</th>
              </tr>
            </thead>
            <tbody id="locationResultBody">
              <tr><td colspan="4" class="text-center text-slate-500 py-8">Select district &amp; thana to search</td></tr>
            </tbody>
          </table>
        </div>
        <div class="p-3 border-t border-slate-200 bg-slate-50/80 rounded-b-xl text-xs text-slate-500 text-center flex justify-between items-center">
          <span id="locationResultMeta">—</span>
          <div class="flex gap-2">
            <button id="exportLocationCsv" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg transition-all disabled:opacity-50" disabled>Export CSV</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
