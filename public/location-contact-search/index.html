<!-- public/location-contact-search/index.html -->
<div id="locationContactSearch" class="space-y-6">
  <!-- ========== HEADER / INFO ========== -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Location‑Based Search
      </h2>
      <p class="text-sm text-slate-500 mt-0.5">Discover people, businesses &amp; services by location</p>
    </div>
    <div class="flex items-center gap-2 text-xs bg-white px-3 py-1.5 rounded-full shadow-sm border border-slate-200">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
      <span class="text-slate-600 font-medium">Live Data</span>
    </div>
  </div>

  <!-- ========== MAIN GRID ========== -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- ===== CONTROL PANEL ===== -->
    <div class="lg:col-span-1">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 sticky top-24 z-10 transition-shadow hover:shadow-md">
        <h3 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
          Filters
        </h3>

        <form id="locationSearchForm" class="space-y-4" novalidate>
          <!-- Division -->
          <div>
            <label for="divisionSelect" class="block text-sm font-semibold text-slate-700 mb-1.5">
              Division <span class="text-red-500">*</span>
            </label>
            <select id="divisionSelect" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white" aria-required="true">
              <option value="">— Select Division —</option>
            </select>
            <p class="text-[11px] text-slate-400 mt-1">বাংলাদেশের ৮টি বিভাগ</p>
          </div>

          <!-- District -->
          <div>
            <label for="districtSelect" class="block text-sm font-semibold text-slate-700 mb-1.5">
              District <span class="text-red-500">*</span>
            </label>
            <select id="districtSelect" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white" aria-required="true" disabled>
              <option value="">— Select District —</option>
            </select>
            <p class="text-[11px] text-slate-400 mt-1">৬৪টি জেলা</p>
          </div>

          <!-- Thana / Upazila -->
          <div>
            <label for="thanaSelect" class="block text-sm font-semibold text-slate-700 mb-1.5">
              Thana / Upazila <span class="text-red-500">*</span>
            </label>
            <select id="thanaSelect" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white" aria-required="true" disabled>
              <option value="">— Select Thana —</option>
            </select>
            <p class="text-[11px] text-slate-400 mt-1">উপজেলা / থানা</p>
          </div>

          <!-- Entity Type (future-ready) -->
          <div>
            <label for="entityTypeSelect" class="block text-sm font-semibold text-slate-700 mb-1.5">Entity Type</label>
            <select id="entityTypeSelect" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
              <option value="all">All</option>
              <option value="business">Business</option>
              <option value="professional">Professional</option>
              <option value="creator">Creator</option>
              <option value="service">Service</option>
            </select>
          </div>

          <!-- Confidence Score (future filter) -->
          <div class="hidden" id="confidenceFilterWrapper">
            <label for="confidenceRange" class="block text-sm font-semibold text-slate-700 mb-1.5">Min Confidence</label>
            <input type="range" id="confidenceRange" min="0" max="100" value="50" class="w-full accent-blue-600">
            <div class="flex justify-between text-xs text-slate-500"><span>0%</span><span id="confidenceValue">50%</span><span>100%</span></div>
          </div>

          <!-- Search Button -->
          <button type="submit" id="searchLocationBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            Search Contacts
          </button>

          <!-- Status / Message -->
          <div id="locationSearchStatus" class="hidden p-3 rounded-lg text-sm font-medium transition-all" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>

    <!-- ===== RESULTS PANEL ===== -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[580px] lg:h-[620px]">
        <!-- Table Header -->
        <div class="p-4 border-b border-slate-200 bg-slate-50/80 rounded-t-xl flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <h3 class="font-semibold text-slate-800 text-sm">📍 Contacts</h3>
            <span id="locationResultCount" class="text-xs bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-full font-medium">0</span>
          </div>
          <div class="flex items-center gap-2 text-xs">
            <button id="exportLocationCsv" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5" disabled>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
              Export CSV
            </button>
            <button id="refreshLocationResults" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium rounded-lg transition-all flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
              Refresh
            </button>
          </div>
        </div>

        <!-- Scrollable Table -->
        <div class="flex-1 overflow-y-auto p-0">
          <table class="data-table w-full" id="locationResultTable" aria-label="Location search results">
            <thead class="sticky top-0 bg-slate-50/95 backdrop-blur-sm z-10">
              <tr>
                <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider border-b border-slate-200">Name</th>
                <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider border-b border-slate-200">Email</th>
                <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider border-b border-slate-200">Phone</th>
                <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider border-b border-slate-200">Thana</th>
              </tr>
            </thead>
            <tbody id="locationResultBody">
              <tr>
                <td colspan="4" class="text-center text-slate-500 py-10 text-sm">Select division, district &amp; thana to search</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Table Footer -->
        <div class="p-3 border-t border-slate-200 bg-slate-50/80 rounded-b-xl text-xs text-slate-500 flex flex-wrap items-center justify-between gap-2">
          <span id="locationResultMeta">—</span>
          <span id="locationLastUpdated" class="text-[10px] text-slate-400"></span>
        </div>
      </div>
    </div>
  </div>
</div>
